<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Loaded through FONTCONFIG_FILE (finish-args). The runtime and the host both
  provide Liberation Sans; with the two copies, Java maps the plain style to
  LiberationSans-Italic.ttf and the whole UI is drawn in italic. Hide the host copy.
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/run/host/fonts/truetype/liberation/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
