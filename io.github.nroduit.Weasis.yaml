app-id: io.github.nroduit.Weasis
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Weasis
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --socket=x11
  - --device=all
  - --filesystem=host
  - --filesystem=/tmp
  - --env=PATH=/app/bin:/usr/bin
x-lint-config:
  suppress:
    - finish-args-host-filesystem-access
    - finish-args-host-tmp-access

modules:

  - name: weasis
    buildsystem: simple
    build-commands:
      - tar xvfz runtime-jdk.tar.gz --transform 's!^[^/]*!java-runtime!'
      - mkdir -p weasis-native
      - unzip -o weasis-native.zip -d weasis-native
      - weasis-native/build/script/package-weasis.sh --output tmp --no-installer --jdk java-runtime
      - mv tmp/Weasis/* /app/
      - install -D weasis.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.svg
      - install -D dicomizer.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.Dicomizer.svg
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.desktop
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.Dicomizer.desktop
      - install -D -t /app/share/metainfo/ io.github.nroduit.Weasis.metainfo.xml
    sources:
      - type: file
        path: io.github.nroduit.Weasis.desktop
      - type: file
        path: io.github.nroduit.Weasis.metainfo.xml
      - type: file
        path: weasis.svg
      - type: file
        path: dicomizer.svg
      - type: file
        path: io.github.nroduit.Weasis.Dicomizer.desktop
      - type: file
        url: https://github.com/nroduit/Weasis/releases/download/v4.7.1/weasis-native.zip
        sha256: e54a329f6e925c802509808d0c9c34e585f15b70008afd6b6dd34583fb8ea1e7
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26.0.1%2B8/OpenJDK26U-jdk_x64_linux_hotspot_26.0.1_8.tar.gz
        sha256: 8e512f13e575a43655fc92319436c94890c137b9035cc6bd6f9cf24239704d3a
        dest-filename: runtime-jdk.tar.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26.0.1%2B8/OpenJDK26U-jdk_aarch64_linux_hotspot_26.0.1_8.tar.gz
        dest-filename: runtime-jdk.tar.gz
        sha256: 613f9b2861dea937b24d5eca745ef8567733b377d0bb612195acaad0e3f61360

