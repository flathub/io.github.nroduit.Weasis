app-id: io.github.nroduit.Weasis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: Weasis
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --socket=x11
  - --device=all
  - --filesystem=host
  - --filesystem=/tmp
  - --env=PATH=/app/bin:/usr/bin
x-lint-config:
  suppress:
    - finish-args-host-filesystem-access
    - finish-args-host-tmp-access

modules:

  - name: weasis
    buildsystem: simple
    build-commands:
      - tar xvfz runtime-jdk.tar.gz --transform 's!^[^/]*!java-runtime!'
      - mkdir -p weasis-native
      - unzip -o weasis-native.zip -d weasis-native
      - weasis-native/build/script/package-weasis.sh --output tmp --no-installer --jdk java-runtime
      - mv tmp/Weasis/* /app/
      - install -D weasis.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.svg
      - install -D dicomizer.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.Dicomizer.svg
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.desktop
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.Dicomizer.desktop
      - install -D -t /app/share/metainfo/ io.github.nroduit.Weasis.metainfo.xml
    sources:
      - type: file
        path: io.github.nroduit.Weasis.desktop
      - type: file
        path: io.github.nroduit.Weasis.metainfo.xml
      - type: file
        path: weasis.svg
      - type: file
        path: dicomizer.svg
      - type: file
        path: io.github.nroduit.Weasis.Dicomizer.desktop
      - type: file
        url: https://github.com/nroduit/Weasis/releases/download/v4.6.6/weasis-native.zip
        sha256: fed30e2576934cdb9cf27e4d8caab20f6d0c7f228e4bc4afda9b948b8c55a9e2
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2%2B12/OpenJDK24U-jdk_x64_linux_hotspot_24.0.2_12.tar.gz
        sha256: aea1cc55e51cf651c85f2f00ad021603fe269c4bb6493fa97a321ad770c9b096
        dest-filename: runtime-jdk.tar.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2%2B12/OpenJDK24U-jdk_aarch64_linux_hotspot_24.0.2_12.tar.gz
        dest-filename: runtime-jdk.tar.gz
        sha256: 6f8725d186d05c627176db9c46c732a6ef3ba41d9e9b3775c4727fc8ac642bb2

