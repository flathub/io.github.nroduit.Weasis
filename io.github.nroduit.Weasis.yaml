app-id: io.github.nroduit.Weasis
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: Weasis
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --socket=x11
  - --device=all
  - --filesystem=host
  - --filesystem=/tmp
  - --env=PATH=/app/bin:/usr/bin
  - --env=FONTCONFIG_FILE=/app/etc/fonts/weasis-fonts.conf
x-lint-config:
  suppress:
    - finish-args-host-filesystem-access
    - finish-args-host-tmp-access

modules:

  - name: weasis
    buildsystem: simple
    build-commands:
      - tar xvfz runtime-jdk.tar.gz --transform 's!^[^/]*!java-runtime!'
      - mkdir -p weasis-native
      - unzip -o weasis-native.zip -d weasis-native
      - weasis-native/build/script/package-weasis.sh --output tmp --no-installer --jdk java-runtime
      - mv tmp/Weasis/* /app/
      - install -D weasis.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.svg
      - install -D dicomizer.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.Dicomizer.svg
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.desktop
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.Dicomizer.desktop
      - install -D -t /app/share/metainfo/ io.github.nroduit.Weasis.metainfo.xml
      - install -D -m644 weasis-fonts.conf /app/etc/fonts/weasis-fonts.conf
    sources:
      - type: file
        path: io.github.nroduit.Weasis.desktop
      - type: file
        path: io.github.nroduit.Weasis.metainfo.xml
      - type: file
        path: weasis.svg
      - type: file
        path: dicomizer.svg
      - type: file
        path: io.github.nroduit.Weasis.Dicomizer.desktop
      - type: file
        path: weasis-fonts.conf
      - type: file
        url: https://github.com/nroduit/Weasis/releases/download/v4.8.0/weasis-native.zip
        sha256: d63a0adeafc9593f5edd571a63c70c1289211d576fc90324363e806b7a6b261c
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_x64_linux_hotspot_27.0.1.0.2_1.tar.gz
        sha256: 30cb129f6cf299c852cec0feca9ea2a596d2ee9f26d8605d3a253951f6c8b20f
        dest-filename: runtime-jdk.tar.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_aarch64_linux_hotspot_27.0.1.0.2_1.tar.gz
        dest-filename: runtime-jdk.tar.gz
        sha256: 5ddacf925244a00b60cac828b61ff2f67a68cd32b8dfe5cee1405e333b4589e5

