app-id: io.github.nroduit.Weasis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: Weasis
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --socket=x11
  - --device=all
  - --filesystem=host
  - --filesystem=/tmp
  - --env=PATH=/app/bin:/usr/bin

modules:

  - name: weasis
    buildsystem: simple
    build-options:
      build-args:
        #- --share=network
    build-commands:
      - tar xvfz runtime-jdk.tar.gz --transform 's!^[^/]*!java-runtime!'
      - mkdir -p weasis-native
      - unzip -o weasis-native.zip -d weasis-native
      - weasis-native/build/script/package-weasis.sh --output tmp --no-installer --jdk java-runtime
      - mv tmp/Weasis/* /app/
      - install -D weasis.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.svg
      - install -D dicomizer.svg /app/share/icons/hicolor/scalable/apps/io.github.nroduit.Weasis.Dicomizer.svg
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.desktop
      - install -D -t /app/share/applications/ io.github.nroduit.Weasis.Dicomizer.desktop
      - install -D -t /app/share/metainfo/ io.github.nroduit.Weasis.metainfo.xml
    sources:
      - type: file
        path: io.github.nroduit.Weasis.desktop
      - type: file
        path: io.github.nroduit.Weasis.metainfo.xml
      - type: file
        path: weasis.svg
      - type: file
        path: dicomizer.svg
      - type: file
        path: io.github.nroduit.Weasis.Dicomizer.desktop
      - type: file
        url: https://github.com/nroduit/Weasis/releases/download/v4.6.0/weasis-native.zip
        sha256: a3a73591274fe9f86bb520064355541423fbc68ef7218f98aa8110cb3cf722eb
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.1%2B9/OpenJDK24U-jdk_x64_linux_hotspot_24.0.1_9.tar.gz
        sha256: 78832cb5ea4074f2215cde0d01d6192d09c87636fc24b36647aea61fb23b8272
        dest-filename: runtime-jdk.tar.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.1%2B9/OpenJDK24U-jdk_aarch64_linux_hotspot_24.0.1_9.tar.gz
        dest-filename: runtime-jdk.tar.gz
        sha256: a598260e340028d9b2383c23df16aa286769a661bd3bf28a52e8c1a5774b1110